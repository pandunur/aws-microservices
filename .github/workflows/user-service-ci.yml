name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'services/user-service/**'
      - '.github/workflows/user-service-ci.yml'
  
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps: 
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: install dependencies
        run: python -m pip install -r services/user-service/requirements.txt
      
      - name: run unit test
        working-directory: services/user-service
        run: python -m pytest test/test_app.py

  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build docker image
        run: docker build -t user-service:latest ./services/user-service/

      - name: run container
        run: docker build -d --name user-service user-service:latest

  docker-push:
    needs: 
      - test
      - docker-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::267544548136:role/github-actions-ecr
          aws-region: ap-southeast-3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-3 | \
            docker login \
              --username AWS \
              --password-stdin 267544548136.dkr.ecr.ap-southeast-3.amazonaws.com

      - name: Build Docker image
        run: docker build -t aws-ms-dev-user-service:${{ github.sha }} ./services/user-service/

      - name: Tag Docker image
        run: |
          docker tag \
            aws-ms-dev-user-service:${{ github.sha }} \
            267544548136.dkr.ecr.ap-southeast-3.amazonaws.com/aws-ms-dev-user-service:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            267544548136.dkr.ecr.ap-southeast-3.amazonaws.com/aws-ms-dev-user-service:${{ github.sha }}
